services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0-jammy
    container_name: cv-evaluation-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-localdev}
      MONGO_INITDB_DATABASE: cv-evaluation
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${MONGO_PORT:-27017}:27017'
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - cv-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    command: mongod --auth

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cv-evaluation-redis
    restart: always
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    networks:
      - cv-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv-evaluation-app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3001}
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-localdev}@mongodb:27017/cv-evaluation?authSource=admin
      REDIS_URL: redis://redis:6379
      SUMOPOD_API_KEY: ${SUMOPOD_API_KEY:-}
      SUMOPOD_BASE_URL: ${SUMOPOD_BASE_URL:-https://ai.sumopod.com/v1}
      SUMOPOD_MODEL: ${SUMOPOD_MODEL:-glm-5.3-flash}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_RETRY_DELAY: ${LLM_RETRY_DELAY:-1000}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_ENVIRONMENT: ${PINECONE_ENVIRONMENT:-}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-cv-evaluation}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      ALLOWED_FILE_TYPES: ${ALLOWED_FILE_TYPES:-.pdf,.docx,.doc,.txt}
      UPLOAD_DIR: uploads
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-2}
      EVALUATION_TIMEOUT: ${EVALUATION_TIMEOUT:-300000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-Landly <noreply@localhost>}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com}
      BACKEND_API: ${BACKEND_API:-}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-3001}:3001'
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./cached:/app/cached
    networks:
      - cv-network
    healthcheck:
      test: ['CMD', 'node', '-e', 'require("node:http").get("http://127.0.0.1:3001/api/health", r => process.exit(r.statusCode === 200 ? 0 : 1)).on("error", () => process.exit(1))']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Local email capture for verification and password reset flows.
  mailpit:
    image: axllent/mailpit:latest
    container_name: cv-evaluation-mailpit
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025'
    networks:
      - cv-network

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:

networks:
  cv-network:
    driver: bridge
